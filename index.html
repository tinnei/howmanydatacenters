{
  const milestones = [

    [1966, '1964 · IBM introduces System/360, a family of compatible mainframes.', 'IBM', 'https://www.ibm.com/history/system-360'],
    [1976, '1969 · The first ARPANET message travels from UCLA to Stanford Research Institute.', 'UCLA', 'https://www.lk.cs.ucla.edu/internet_first_words.html'],
    [1986, '1986 · NSFNET begins connecting researchers to U.S. supercomputing centers.', 'National Science Foundation', 'https://www.nsf.gov/about/history/nsf0050/pdf/internet.pdf'],
    [1996, '1990 · The first web server runs at CERN, making websites possible.', 'CERN', 'https://home.cern/science/computing/the-birth-of-the-web/short-history-web/'],
    [2006, '2006 · Amazon EC2 launches, letting customers rent computing capacity by the hour.', 'AWS', 'https://aws.amazon.com/blogs/aws/ec2-instance-history/'],
    [2016, '2011 · Facebook shares designs from its Oregon data center through the Open Compute Project.', 'Meta', 'https://about.fb.com/news/2011/04/facebook-launches-open-compute-project/'],
    ['Now', '2026 · The IEA reports rising electricity demand from data centers as AI use expands.', 'International Energy Agency', 'https://www.iea.org/news/data-centre-electricity-use-surged-in-2025-even-with-tightening-bottlenecks-driving-a-scramble-for-solutions']
  ];
  const ticks = document.getElementById('history-ticks');
  const event = document.getElementById('history-event');
  const source = document.getElementById('history-source');
  ticks.style.setProperty('--ticks', milestones.length);
  let selectedTick;
  const buttons = milestones.map(([year, description, publisher, url]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = year;
    button.setAttribute('aria-label', year === 'Now' ? 'Now' : year === 1946 ? '1946' : 'Decade ending in ' + year);
    button.setAttribute('aria-pressed', 'false');
    button.addEventListener('click', () => {
      selectedTick?.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-pressed', 'true');
      selectedTick = button;
      event.textContent = description;
      source.textContent = publisher + ' ↗';
      source.href = url;
    });
    ticks.appendChild(button);
    return button;
  });
  buttons[0].click();
}

<script type="module">

tickClock();setInterval(tickClock,1000);

const globe=new THREE.Group();

const R=1.72;

controls.minDistance=2.8;controls.maxDistance=9;controls.rotateSpeed=.52;controls.enableZoom=true;

function xyz(lat,lon,r=R){const a=(90-lat)*Math.PI/180,b=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(a)*Math.cos(b),r*Math.cos(a),r*Math.sin(a)*Math.sin(b));}
// A quiet, evenly spaced pointillist land layer.
const landDots=new THREE.Group();globe.add(landDots);
const continentNames=['Africa','Antarctica','Asia','Europe','North America','Oceania','South America'];
const continentOutlines=new Map();
let countryPolygons=[],landMesh=null,landContinentIds=[],landPositions=[],siteGroups=[],activeContinent=null,siteTotal=null;
function continentName(properties,lookup){

function continentAt(lon,lat){
for(const item of countryPolygons){
if(lat<item.minLat||lat>item.maxLat||lon<item.minLon||lon>item.maxLon)continue;

}
function updateCount(){
  const count=document.getElementById('count');
  const total=document.getElementById('countTotal');
  total.hidden=siteTotal===null;
  if(siteTotal===null){
    count.textContent='—';
    return;
  }
  const visibleCount=activeContinent
    ?siteGroups.reduce((sum,group)=>sum+group.items.filter(item=>item.continent===activeContinent).length,0)
    :siteTotal;
  count.textContent=visibleCount.toLocaleString();
  document.getElementById('totalCount').textContent=siteTotal.toLocaleString();

function updateFocus(){
if(!landPositions.length)return;
const direction=camera.position.clone().normalize().applyQuaternion(globe.quaternion.clone().invert());
let best=-1,continent='';
for(let i=0;i<landPositions.length;i++){
const score=landPositions[i].dot(direction)/landPositions[i].length();
if(score>best){best=score;continent=landContinentIds[i];}
}
const next=best>.72?continent:'';
if(next===activeContinent)return;

for(const [name,outline] of continentOutlines)outline.visible=name===next;

document.querySelector('.unit').textContent=next?'mapped sites in '+next:'mapped sites';

const normal=new THREE.Color(0xb9bdbb),highlight=new THREE.Color(0x929c99);

}

}
halo.visible=false;if(typeof hide==='function')hide();
}
function insideRing(x,y,ring){let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))inside=!inside;}return inside;}

  const material=new THREE.LineBasicMaterial({color:0x617572,depthWrite:false});
  for(const name of continentNames){
    const boundary=new Map();
    for(const {poly,continent} of polygons){
      if(continent!==name)continue;
      for(const ring of poly){
        for(let i=1;i<ring.length;i++){
          const a=ring[i-1],b=ring[i];

          if(a[0]===b[0]&&Math.abs(a[0])===180)continue;

    }

    let offset=0;
    for(const edge of boundary.values()){
      for(const [lon,lat] of edge){
        xyz(lat,lon,R+.004).toArray(positions,offset);
        offset+=3;
      }
    }
    const geometry=new THREE.BufferGeometry();
    geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
    const outline=new THREE.LineSegments(geometry,material);
    outline.visible=false;
    continentOutlines.set(name,outline);
    globe.add(outline);
  }

async function land(){
try{
const r=await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
if(!r.ok)throw Error('Land data unavailable');

const continentLookup=await lookupResponse.json();
// Fill only the land polygons with a very pale sage green; keep oceans white.
const canvas=document.createElement('canvas');canvas.width=2048;canvas.height=1024;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#f9faf9';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#eceeed';

}

const g=feature.geometry;if(!g)continue;

sphere.material.map=texture;sphere.material.needsUpdate=true;
const polys=[];
for(const f of data.features||[]){const g=f.geometry,continent=continentName(f.properties||{},continentLookup);if(!g)continue;const shapes=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of shapes)polys.push({poly,continent});}

const bounded=polys.map(({poly,continent})=>{const ring=poly[0]||[];return {poly,continent,minLat:Math.min(...ring.map(p=>p[1])),maxLat:Math.max(...ring.map(p=>p[1])),minLon:Math.min(...ring.map(p=>p[0])),maxLon:Math.max(...ring.map(p=>p[0]))};});countryPolygons=bounded;

for(let lon=-180;lon<180;lon+=step){

}
land();
const pins=new THREE.Group();globe.add(pins);
const dots=[],records=[];
function coordinate(geom){if(!geom)return null;if(geom.type==='Point')return geom.coordinates;if(geom.type==='MultiPoint')return geom.coordinates?.[0];if(geom.type==='Polygon')return average(geom.coordinates?.[0]);if(geom.type==='MultiPolygon')return average(geom.coordinates?.[0]?.[0]);return null;}
function average(coords){if(!Array.isArray(coords)||!coords.length)return null;let x=0,y=0,n=0;for(const c of coords){if(Array.isArray(c)&&Number.isFinite(+c[0])&&Number.isFinite(+c[1])){x+=+c[0];y+=+c[1];n++;}}return n?[x/n,y/n]:null;}
function label(p){return p.name||p.site_name||p.facility_name||p.title||p.site_id||'Data center site';}
function display(p){return [p.city||p.locality||p.location_name,p.country||p.country_name].filter(Boolean).join(', ')||'Publicly mapped location';}
function parseCSV(text){
const rows=[];let row=[],value='',quoted=false;
for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(value);value='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(Boolean))rows.push(row);row=[];value='';}else value+=c;}
row.push(value);if(row.some(Boolean))rows.push(row);

// The Atlas distinguishes a site from its projects. A site may contain multiple phases.
const OPERATING=new Set(['operational','operating','in_operation','open','active']);

function category(value){
const v=String(value||'').toLowerCase().trim().replaceAll(' ','_');
if(OPERATING.has(v))return 'existing';
if(UPCOMING.has(v))return 'upcoming';

}
function statusList(p){
const raw=p.statuses||p.statuses_json;
if(Array.isArray(raw))return raw;
if(typeof raw==='string'){try{const a=JSON.parse(raw);if(Array.isArray(a))return a;}catch{}}

}

const kinds=statuses.map(category);
if(kinds.includes('existing'))return 'existing';

}
async function loadSites(){
try{
const base='https://kiankyars.github.io/datacenter-atlas/downloads/latest/';
const response=await fetch(base+'sites.geojson',{cache:'no-store'});
if(!response.ok)throw Error('Dataset HTTP '+response.status);
const data=await response.json();
const groups={existing:[],upcoming:[],unknown:[]};
for(const f of data.features||[]){
const p=f.properties||{},c=coordinate(f.geometry);
if(!c||!Number.isFinite(+c[0])||!Number.isFinite(+c[1])||Math.abs(+c[1])>90)continue;
const kind=classify(statusList(p));
groups[kind].push({p,c,kind,continent:continentAt(+c[0],+c[1])});
}
const geo=new THREE.SphereGeometry(.014,8,6);
const colors={existing:0x2474dc,upcoming:0xb6d8fa,unknown:0x9aa7b6};
for(const kind of ['existing','upcoming','unknown']){
const entries=groups[kind];if(!entries.length)continue;
const mesh=new THREE.InstancedMesh(geo,new THREE.MeshBasicMaterial({color:colors[kind]}),entries.length);
const dummy=new THREE.Object3D(),local=[];
entries.forEach(({p,c},i)=>{dummy.position.copy(xyz(+c[1],+c[0],R+.025));dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);local.push({...p,_kind:kind});});
mesh.instanceMatrix.needsUpdate=true;pins.add(mesh);dots.push(mesh);records.push(local);siteGroups.push({mesh,items:entries,color:colors[kind]});
}
siteTotal=Object.values(groups).reduce((n,items)=>n+items.length,0);
activeContinent=null;
if(landPositions.length)updateFocus();else updateCount();
status.textContent='';
}catch(error){console.error('Site data failed to load',error);status.textContent='Site data currently unavailable';siteTotal=null;updateCount();}
}
loadSites();
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),tooltip=document.getElementById('tooltip');
const tipName=document.getElementById('tipname'),tipDetail=document.getElementById('tipdetail');
const tipStatus=document.getElementById('tipstatus'),tipMore=document.getElementById('tipmore');
const tipSource=document.getElementById('tipsource');
// A crisp halo tracks the hovered/selected marker without changing the data dot.
const halo=new THREE.Mesh(
  new THREE.RingGeometry(.019,.027,32),
  new THREE.MeshBasicMaterial({color:0x2474dc,side:THREE.DoubleSide,depthTest:true,depthWrite:false})
);
halo.visible=false;halo.renderOrder=3;scene.add(halo);
const instanceMatrix=new THREE.Matrix4(),instancePosition=new THREE.Vector3();
function outlineMarker(hit){
if(!hit){halo.visible=false;return;}
const [group,index]=hit.id.split(':').map(Number),mesh=dots[group];
if(!mesh){halo.visible=false;return;}
mesh.getMatrixAt(index,instanceMatrix);
instancePosition.setFromMatrixPosition(instanceMatrix);
mesh.localToWorld(instancePosition);
halo.position.copy(instancePosition);
halo.position.addScaledVector(instancePosition.clone().normalize(),.015);
halo.material.color.setHex(hit.p._kind==='upcoming'?0x78aee9:hit.p._kind==='unknown'?0x8396a7:0x2474dc);
halo.visible=true;
}

let downX=0,downY=0,dragged=false,pinned=false,lastHover=null;
function clean(value){return value==null?'':String(value).trim();}
function first(p,keys){for(const k of keys){if(clean(p[k]))return clean(p[k]);}return '';}
function safeUrl(value){try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:'';}catch{return '';}}
function pick(e){
if(!dots.length)return null;
const rect=renderer.domElement.getBoundingClientRect();
pointer.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
ray.setFromCamera(pointer,camera);
const hits=ray.intersectObjects([sphere,...dots],false);
const hit=hits[0]; // The globe occludes markers on its far side.
if(!hit||hit.object===sphere)return null;
const group=dots.indexOf(hit.object);
if(group<0)return null;
const p=records[group]?.[hit.instanceId];
if(activeContinent&&siteGroups[group]?.items[hit.instanceId]?.continent!==activeContinent)return null;
return p?{p,id:group+':'+hit.instanceId}:null;
}
function placeTooltip(e){
const width=285,height=tooltip.offsetHeight||160;
tooltip.style.left=Math.max(14,Math.min(e.clientX+16,innerWidth-width-14))+'px';
tooltip.style.top=Math.max(14,Math.min(e.clientY+16,innerHeight-height-14))+'px';
}
function showSite(hit,e,lock){
outlineMarker(hit);
const p=hit.p;
tipName.textContent=label(p);
tipDetail.textContent=display(p);
tipStatus.textContent=p._kind==='existing'?'● Operating':p._kind==='upcoming'?'● Upcoming':'● Status unverified';
tipStatus.style.color=p._kind==='existing'?'#2474dc':p._kind==='upcoming'?'#78aee9':'#8996a4';
const raw=statusList(p).map(clean).filter(Boolean).map(v=>v.replaceAll('_',' '));
const asOf=first(p,['newest_status_as_of','status_as_of','last_verified','observation_date']);
const operator=first(p,['operator','operator_name','company','owner','owner_name']);
const capacity=first(p,['reported_capacity_mw','capacity_mw']);
const precision=first(p,['location_precision','coordinate_precision','precision']);
const parts=[];
if(operator)parts.push('Operator: '+operator);
if(raw.length)parts.push('Reported status: '+raw.join(', '));
if(capacity)parts.push('Reported capacity: '+capacity+' MW');
if(precision)parts.push('Location precision: '+precision);
if(asOf)parts.push('Observed: '+asOf);
tipMore.textContent=parts.join(' · ');
const url=safeUrl(first(p,['source_url','evidence_url','website','url']));
tipSource.hidden=!url;if(url)tipSource.href=url;else tipSource.removeAttribute('href');
pinned=lock;tooltip.classList.toggle('pinned',lock);
tooltip.classList.add('visible');placeTooltip(e);
}
function hide(){pinned=false;lastHover=null;halo.visible=false;tooltip.classList.remove('visible','pinned');}
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;dragged=false;controls.autoRotate=false;});
renderer.domElement.addEventListener('pointermove',e=>{
if(Math.hypot(e.clientX-downX,e.clientY-downY)>5)dragged=true;
if(pinned||e.buttons)return;
const hit=pick(e);
renderer.domElement.style.cursor=hit?'pointer':'grab';
if(!hit){lastHover=null;halo.visible=false;tooltip.classList.remove('visible');return;}
if(hit.id!==lastHover){lastHover=hit.id;showSite(hit,e,false);}else placeTooltip(e);
});
renderer.domElement.addEventListener('pointerleave',()=>{if(!pinned)hide();});
renderer.domElement.addEventListener('click',e=>{
if(dragged)return;
const hit=pick(e);if(!hit){hide();return;}
lastHover=hit.id;showSite(hit,e,true);
});
document.getElementById('tipclose').addEventListener('click',hide);
addEventListener('keydown',e=>{if(e.key==='Escape')hide();});
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.fov=w<690?48:36;camera.updateProjectionMatrix();const headerTop=document.querySelector('header').getBoundingClientRect().top;const footerTop=document.querySelector(w<=680?'footer':'.footnote').getBoundingClientRect().top;const available=Math.max(240,footerTop-headerTop-24);const desired=Math.max(160,Math.min(h*.72,available)-60);const fov=camera.fov*Math.PI/180;const distance=R/Math.sin(Math.atan(desired/h*Math.tan(fov/2)*2));camera.position.setLength(Math.max(5.95,distance));controls.minDistance=2.8;renderer.setSize(w,h);}
addEventListener('resize',resize);resize();
let frame=0;
(function animate(){requestAnimationFrame(animate);controls.update();globe.updateMatrixWorld();if(landPositions.length&&frame++%18===0)updateFocus();if(halo.visible)halo.quaternion.copy(camera.quaternion);renderer.render(scene,camera);})();
</script>
</body>
</html>
