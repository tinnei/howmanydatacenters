<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#ffffff"/>
<meta name="description" content="How many data centers? A quiet, interactive globe of publicly mapped data center sites."/>
<title>How Many Data Centers?</title>
<style>
:root{color-scheme:light;--ink:#262726;--muted:#999b99;--line:#e6e7e5}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#globe{position:fixed;inset:0;touch-action:none;cursor:grab}
#globe:active{cursor:grabbing}
header{position:absolute;z-index:2;top:clamp(27px,5vw,70px);left:clamp(24px,5.5vw,94px);pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#a4a5a4;font-weight:600;margin-bottom:17px}
h1{font-size:clamp(30px,4.8vw,68px);font-weight:440;letter-spacing:-.065em;line-height:1.05;margin:0}
.sub{font-size:12px;line-height:1.8;color:#999b99;margin-top:17px;max-width:300px}
.metric{position:absolute;z-index:2;top:clamp(29px,5vw,70px);right:clamp(24px,5.5vw,94px);text-align:right;pointer-events:none}
.utc-clock{font-size:12px;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:#707774;margin-bottom:13px}.count{font-size:clamp(30px,4.3vw,60px);letter-spacing:-.065em;font-weight:430;font-variant-numeric:tabular-nums}
.unit{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#a1a3a1;margin-top:5px}
footer{position:absolute;left:clamp(24px,5.5vw,94px);right:clamp(24px,5.5vw,94px);bottom:clamp(22px,4vw,45px);display:flex;align-items:end;justify-content:space-between;z-index:2;gap:30px}
.footnote{font-size:10px;line-height:1.9;color:#a4a5a4;max-width:380px}
a{color:#747774;text-decoration:none;border-bottom:1px solid #d5d7d5}
a:hover{color:#242524;border-color:#242524}
.control{font-size:10px;color:#a4a5a4;letter-spacing:.03em;white-space:nowrap}
#tooltip{position:fixed;z-index:4;padding:13px 16px;background:#fff;border:1px solid #e8e8e8;box-shadow:0 6px 30px #2222220b;border-radius:6px;max-width:240px;pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .15s,transform .15s}
#tooltip.visible{opacity:1;transform:translateY(0)}
#tooltip strong{display:block;font-size:12px;font-weight:550;line-height:1.5}
#tooltip span{display:block;color:#9b9d9b;font-size:10px;line-height:1.6;margin-top:4px}
#status{position:fixed;bottom:50%;left:50%;transform:translate(-50%,190px);font-size:11px;color:#a4a5a4;letter-spacing:.02em;z-index:2;pointer-events:none;white-space:nowrap}
@media(max-width:680px){header{top:24px}h1{font-size:32px}.sub{max-width:190px;font-size:11px}.metric{top:24px;bottom:auto;right:24px}.utc-clock{font-size:10px;margin-bottom:9px}.count{font-size:35px}footer{bottom:20px}.footnote{max-width:220px;font-size:9px}.control{display:none}#status{transform:translate(-50%,170px)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<div id="globe" aria-label="Interactive 3D globe showing public data center site locations"></div>
<header>

<h1>how many<br/>data centers</h1>

</header>
<div class="metric" aria-live="polite"><div id="utcClock" class="utc-clock">--:--:-- UTC</div>
<div id="count" class="count">—</div>
<div class="unit">mapped sites</div>
</div>
<div id="status">Loading locations…</div>
<div id="tooltip" role="status"><strong id="tipname"></strong><span id="tipdetail"></span></div>
<footer>
<div class="footnote">Data: <a href="https://github.com/kiankyars/datacenter-atlas" target="_blank" rel="noopener noreferrer">Data Center Atlas</a> · CC BY 4.0 · <span style="color:#2474dc">●</span> operating · <span style="color:#b6d8fa">●</span> upcoming · <span style="color:#9aa7b6">●</span> unverified</div>

</footer>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const root=document.getElementById('globe'), status=document.getElementById('status');
const clock=document.getElementById('utcClock');
function tickClock(){clock.textContent=new Date().toISOString().slice(11,19)+' UTC';}
tickClock();setInterval(tickClock,1000);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xffffff);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,5.9);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'default'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1));
const globe=new THREE.Group();
scene.add(globe);
const R=1.72;
const sphere=new THREE.Mesh(new THREE.SphereGeometry(R,96,64),new THREE.MeshBasicMaterial({color:0xffffff}));
globe.add(sphere);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.055;
controls.minDistance=2.8;controls.maxDistance=9;controls.rotateSpeed=.52;controls.enableZoom=true;
controls.autoRotate=!matchMedia('(prefers-reduced-motion: reduce)').matches;controls.autoRotateSpeed=.18;
controls.target.set(0,0,0);
function xyz(lat,lon,r=R){const a=(90-lat)*Math.PI/180,b=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(a)*Math.cos(b),r*Math.cos(a),r*Math.sin(a)*Math.sin(b));}
// A quiet, evenly spaced pointillist land layer.
const landDots=new THREE.Group();globe.add(landDots);
function insideRing(x,y,ring){let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))inside=!inside;}return inside;}
function inPolygon(lon,lat,poly){if(!poly?.length||!insideRing(lon,lat,poly[0]))return false;for(let i=1;i<poly.length;i++)if(insideRing(lon,lat,poly[i]))return false;return true;}
async function land(){
try{
const r=await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
if(!r.ok)throw Error('Land data unavailable');
const data=await r.json();
// Fill only the land polygons with a very pale sage green; keep oceans white.
const canvas=document.createElement('canvas');canvas.width=2048;canvas.height=1024;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#eeeeee';
function paintRing(ring){
if(!ring?.length)return;
let prev=null;
for(const point of ring){
const x=(point[0]+180)/360*canvas.width,y=(90-point[1])/180*canvas.height;
if(prev===null)ctx.moveTo(x,y);
else if(Math.abs(x-prev)>canvas.width/2){ctx.lineTo(prev<canvas.width/2?0:canvas.width,y);ctx.moveTo(x<canvas.width/2?0:canvas.width,y);ctx.lineTo(x,y);}
else ctx.lineTo(x,y);
prev=x;
}
ctx.closePath();
}
for(const feature of data.features||[]){
const g=feature.geometry;if(!g)continue;
const shapes=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
for(const polygon of shapes){ctx.beginPath();for(const ring of polygon)paintRing(ring);ctx.fill('evenodd');}
}
const basePixels=ctx.getImageData(0,0,canvas.width,canvas.height);
const texture=new THREE.CanvasTexture(canvas);
texture.colorSpace=THREE.SRGBColorSpace;
sphere.material.map=texture;sphere.material.needsUpdate=true;
function updateSun(date){
  // NOAA-style solar declination and equation-of-time approximation.
  const start=Date.UTC(date.getUTCFullYear(),0,1);
  const day=(date.getTime()-start)/86400000;
  const gamma=2*Math.PI/365*(day+(date.getUTCHours()-12)/24);
  const decl=.006918-.399912*Math.cos(gamma)+.070257*Math.sin(gamma)-.006758*Math.cos(2*gamma)+.000907*Math.sin(2*gamma)-.002697*Math.cos(3*gamma)+.00148*Math.sin(3*gamma);
  const eq=229.18*(.000075+.001868*Math.cos(gamma)-.032077*Math.sin(gamma)-.014615*Math.cos(2*gamma)-.040849*Math.sin(2*gamma));
  const utc=date.getUTCHours()*60+date.getUTCMinutes()+date.getUTCSeconds()/60;
  const sunLon=(720-utc-eq)/4;
  const latSin=Math.sin(decl),latCos=Math.cos(decl);
  const out=new ImageData(new Uint8ClampedArray(basePixels.data),canvas.width,canvas.height);
  const pixels=out.data;
  for(let y=0;y<canvas.height;y++){
    const lat=(90-(y+.5)*180/canvas.height)*Math.PI/180;
    const a=Math.sin(lat)*latSin,b=Math.cos(lat)*latCos;
    for(let x=0;x<canvas.width;x++){
      const lon=(x+.5)*360/canvas.width-180;
      const altitude=a+b*Math.cos((lon-sunLon)*Math.PI/180);
      // A quiet twilight transition, with a cool gray nighttime tint.
      const daylight=THREE.MathUtils.smoothstep(altitude,-.11,.09);
      const shade=.78+.22*daylight;
      const i=(y*canvas.width+x)*4;
      pixels[i]=pixels[i]*shade;
      pixels[i+1]=pixels[i+1]*shade;
      pixels[i+2]=pixels[i+2]*shade;
    }
  }
  ctx.putImageData(out,0,0);texture.needsUpdate=true;
}
updateSun(new Date());
setInterval(()=>updateSun(new Date()),60000);
const polys=[];
for(const f of data.features||[]){const g=f.geometry;if(g?.type==='Polygon')polys.push(g.coordinates);else if(g?.type==='MultiPolygon')polys.push(...g.coordinates);}
const bounded=polys.map(poly=>{const ring=poly[0]||[];return {poly,minLat:Math.min(...ring.map(p=>p[1])),maxLat:Math.max(...ring.map(p=>p[1])),minLon:Math.min(...ring.map(p=>p[0])),maxLon:Math.max(...ring.map(p=>p[0]))};});
const points=[];
for(let lat=-87.5;lat<=87.5;lat+=2.5){
const step=2.5/Math.max(.23,Math.cos(lat*Math.PI/180));
for(let lon=-180;lon<180;lon+=step){
if(bounded.some(b=>lat>=b.minLat&&lat<=b.maxLat&&lon>=b.minLon&&lon<=b.maxLon&&inPolygon(lon,lat,b.poly)))points.push(xyz(lat,lon,R+.009));
}}
const geo=new THREE.SphereGeometry(.0052,5,4),mat=new THREE.MeshBasicMaterial({color:0xb9bdbb});
const mesh=new THREE.InstancedMesh(geo,mat,points.length),dummy=new THREE.Object3D();
points.forEach((p,i)=>{dummy.position.copy(p);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);});
mesh.instanceMatrix.needsUpdate=true;landDots.add(mesh);
}catch(err){console.warn('Land dots unavailable',err);}
}
land();
const pins=new THREE.Group();globe.add(pins);
const dots=[],records=[];
function coordinate(geom){if(!geom)return null;if(geom.type==='Point')return geom.coordinates;if(geom.type==='MultiPoint')return geom.coordinates?.[0];if(geom.type==='Polygon')return average(geom.coordinates?.[0]);if(geom.type==='MultiPolygon')return average(geom.coordinates?.[0]?.[0]);return null;}
function average(coords){if(!Array.isArray(coords)||!coords.length)return null;let x=0,y=0,n=0;for(const c of coords){if(Array.isArray(c)&&Number.isFinite(+c[0])&&Number.isFinite(+c[1])){x+=+c[0];y+=+c[1];n++;}}return n?[x/n,y/n]:null;}
function label(p){return p.name||p.site_name||p.facility_name||p.title||p.site_id||'Data center site';}
function display(p){return [p.city||p.locality||p.location_name,p.country||p.country_name].filter(Boolean).join(', ')||'Publicly mapped location';}
function parseCSV(text){
const rows=[];let row=[],value='',quoted=false;
for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(value);value='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(Boolean))rows.push(row);row=[];value='';}else value+=c;}
row.push(value);if(row.some(Boolean))rows.push(row);
const header=rows.shift()||[];return rows.map(r=>Object.fromEntries(header.map((h,i)=>[h.trim(),r[i]||''])));
}
// The Atlas distinguishes a site from its projects. A site may contain multiple phases.
const OPERATING=new Set(['operational','operating','in_operation','open','active']);
const UPCOMING=new Set(['announced','proposed','site_control','permitting','permitted','site_preparation','clearing','civil_works','foundations','shell','mep_electrical','under_construction','commissioning','construction']);
function category(value){
const v=String(value||'').toLowerCase().trim().replaceAll(' ','_');
if(OPERATING.has(v))return 'existing';
if(UPCOMING.has(v))return 'upcoming';
return 'unknown'; // completed is not proof of operation; leads are not confirmed.
}
function statusList(p){
const raw=p.statuses||p.statuses_json;
if(Array.isArray(raw))return raw;
if(typeof raw==='string'){try{const a=JSON.parse(raw);if(Array.isArray(a))return a;}catch{}}
return [p.last_observed_physical_status||p.status||p.operational_status||p.development_status].filter(Boolean);
}
function classify(statuses){
const kinds=statuses.map(category);
if(kinds.includes('existing'))return 'existing';
if(kinds.includes('upcoming'))return 'upcoming';
return 'unknown';
}
async function loadSites(){
try{
const base='https://kiankyars.github.io/datacenter-atlas/downloads/latest/';
const response=await fetch(base+'sites.geojson',{cache:'no-store'});
if(!response.ok)throw Error('Dataset HTTP '+response.status);
const data=await response.json();
const groups={existing:[],upcoming:[],unknown:[]};
for(const f of data.features||[]){
const p=f.properties||{},c=coordinate(f.geometry);
if(!c||!Number.isFinite(+c[0])||!Number.isFinite(+c[1])||Math.abs(+c[1])>90)continue;
const kind=classify(statusList(p));
groups[kind].push({p,c,kind});
}
const geo=new THREE.SphereGeometry(.014,8,6);
const colors={existing:0x2474dc,upcoming:0xb6d8fa,unknown:0x9aa7b6};
for(const kind of ['existing','upcoming','unknown']){
const entries=groups[kind];if(!entries.length)continue;
const mesh=new THREE.InstancedMesh(geo,new THREE.MeshBasicMaterial({color:colors[kind]}),entries.length);
const dummy=new THREE.Object3D(),local=[];
entries.forEach(({p,c},i)=>{dummy.position.copy(xyz(+c[1],+c[0],R+.025));dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);local.push({...p,_kind:kind});});
mesh.instanceMatrix.needsUpdate=true;pins.add(mesh);dots.push(mesh);records.push(local);
}
const total=Object.values(groups).reduce((n,items)=>n+items.length,0);
document.getElementById('count').textContent=total.toLocaleString();
status.textContent='';
}catch(error){console.error('Site data failed to load',error);status.textContent='Site data currently unavailable';document.getElementById('count').textContent='—';}
}
loadSites();
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),tooltip=document.getElementById('tooltip');
let startX=0,startY=0,moved=false;
renderer.domElement.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;moved=false;controls.autoRotate=false;});
renderer.domElement.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-startX,e.clientY-startY)>5)moved=true;});
renderer.domElement.addEventListener('click',e=>{
if(moved||!dots.length)return;
const rect=renderer.domElement.getBoundingClientRect();pointer.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
ray.setFromCamera(pointer,camera);
const hit=ray.intersectObjects([sphere,...dots],false)[0];
if(!hit||hit.object===sphere){tooltip.classList.remove('visible');return;}
const p=records[dots.indexOf(hit.object)]?.[hit.instanceId]||{};
document.getElementById('tipname').textContent=String(label(p));
const raw=statusList(p);const asOf=p.newest_status_as_of||p.status_as_of||'';
document.getElementById('tipdetail').textContent=String(display(p)+' · '+(raw.length?raw.join(', ').replaceAll('_',' '):'status unknown')+(asOf?' · as of '+asOf:''));
tooltip.style.left=Math.min(e.clientX+14,innerWidth-245)+'px';
tooltip.style.top=Math.max(12,Math.min(e.clientY+12,innerHeight-100))+'px';
tooltip.classList.add('visible');
});
renderer.domElement.addEventListener('pointerdown',()=>tooltip.classList.remove('visible'));
addEventListener('keydown',e=>{if(e.key==='Escape')tooltip.classList.remove('visible');});
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.fov=w<690?48:36;camera.updateProjectionMatrix();renderer.setSize(w,h);}
addEventListener('resize',resize);resize();
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);})();
</script>
</body>
</html>
