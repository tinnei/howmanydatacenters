<script>
{
  const snapshots = [
    [2021, 'September 2021 snapshot'],
    [2022, 'December 2022 snapshot'],
    [2023, 'December 2023 snapshot'],
    [2024, 'December 2024 snapshot'],
    [2025, 'December 2025 snapshot'],
    [2026, '2026 snapshot', 'International Energy Agency', 'https://www.iea.org/news/data-centre-electricity-use-surged-in-2025-even-with-tightening-bottlenecks-driving-a-scramble-for-solutions'],
    ['Now', 'Current Atlas map', 'Data Center Atlas', 'https://github.com/kiankyars/datacenter-atlas']
  ];
  // Published snapshots have different coverage. Each number stays with its own scope.
  const countSnapshots = new Map([
    [2021, {
      value: '700',
      publisher: 'Synergy Research Group',
      url: 'https://www.srgresearch.com/articles/as-hyperscale-data-center-capacity-doubles-in-under-four-years-the-us-still-accounts-for-half-of-the-total'
    }],
    [2023, {
      value: '992',
      publisher: 'Synergy Research Group',
      url: 'https://www.srgresearch.com/articles/hyperscale-data-centers-hit-the-thousand-mark-total-capacity-is-doubling-every-four-years'
    }],
    [2024, {
      value: '1,136',
      publisher: 'Synergy Research Group',
      url: 'https://www.srgresearch.com/articles/hyperscale-data-center-count-hits-1136-average-size-increases-us-accounts-for-54-of-total-capacity'
    }],
    [2025, {
      value: '1,360',
      publisher: 'Synergy Research Group',
      url: 'https://www.srgresearch.com/articles/hyperscale-operators-to-account-for-67-of-all-data-center-capacity-by-2031'
    }]
  ]);
  const archiveMonths = new Map([[2021,'2021/09'],[2022,'2022/12'],[2023,'2023/12'],[2024,'2024/12'],[2025,'2025/12'],[2026,'2026/11']]);
  const ticks = document.getElementById('history-ticks');
  const recentTicks = document.getElementById('history-recent');
  const archiveSource = document.getElementById('history-archive-source');
  const event = document.getElementById('history-event');
  const sourceMenu = document.getElementById('history-source-menu');
  const source = document.getElementById('history-source');
  const countSource = document.getElementById('history-count-source');
  recentTicks.style.setProperty('--ticks', archiveMonths.size);
  let selectedTick;
  const buttons = snapshots.map(([year, description, publisher, url]) => {
    const atlas = year === 'Now';
    const button = atlas ? document.getElementById('history-atlas') : document.createElement('button');
    button.type = 'button';
    if(!atlas)button.textContent = year;
    const archiveMonth = archiveMonths.get(year);
    button.setAttribute('aria-pressed', 'false');
    button.addEventListener('click', () => {
      selectedTick?.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-pressed', 'true');
      selectedTick = button;
      const snapshot = countSnapshots.get(year);
      event.textContent = snapshot ? snapshot.value + ' hyperscale data centers worldwide' : description;
      sourceMenu.open = false;
      source.hidden = !url;
      source.textContent = publisher ?? '';
      if(url)source.href = url;
      archiveSource.hidden = !archiveMonth;
      if(archiveMonth){
        archiveSource.href = 'https://data.caida.org/datasets/peeringdb-v2/' + archiveMonth + '/';
        archiveSource.textContent = 'PeeringDB facility archive (CAIDA)';
      }
      countSource.hidden = !snapshot;
      if(snapshot){
        countSource.textContent = snapshot.publisher;
        countSource.href = snapshot.url;
      }
      ticks.dispatchEvent(new CustomEvent('milestonechange', {detail: {year}}));
    });
    if(!atlas)recentTicks.appendChild(button);
    return button;
  });
  buttons[0].click();
}
</script>
<script type="module">
const root=document.getElementById('globe');
const loader=document.getElementById('globe-loader');
const statusText=document.getElementById('globe-status-text');
function setGlobeStatus(message,loading=false){
  loader.hidden=!loading;
  if(statusText.textContent!==message)statusText.textContent=message;
}
const [THREE,{OrbitControls}]=await Promise.all([
  import('three'),
  import('three/addons/controls/OrbitControls.js')
]).catch(error=>{
  setGlobeStatus('The globe could not load.');
  throw error;
});
const clock=document.getElementById('utcClock');
function tickClock(){clock.textContent=new Date().toISOString().slice(11,19)+' UTC';}
tickClock();setInterval(tickClock,1000);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xffffff);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,6.25);
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'default'});
}catch(error){
  setGlobeStatus('The 3D globe requires WebGL.');
  throw error;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1));
const globe=new THREE.Group();
scene.add(globe);
const R=1.72;
const sphere=new THREE.Mesh(new THREE.SphereGeometry(R,128,96),new THREE.MeshBasicMaterial({color:0xffffff}));
globe.add(sphere);
// Very soft, view-dependent edge tint gives the white globe a spherical silhouette.
// Unlike a sun shadow, it stays consistent when visitors rotate the globe.
const edge=new THREE.Mesh(new THREE.SphereGeometry(R+.002,128,96),new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,
  vertexShader:`varying vec3 vNormal;varying vec3 vView;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vNormal=normalize(normalMatrix*normal);vView=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vNormal;varying vec3 vView;void main(){float rim=pow(1.0-max(dot(normalize(vNormal),normalize(vView)),0.0),3.2);gl_FragColor=vec4(vec3(0.72,0.75,0.76),rim*0.20);}`

let sitePulseStart=0;
const instanceMatrix=new THREE.Matrix4(),instancePosition=new THREE.Vector3();
function showSitePulse(hit){
  const [group,index]=hit.id.split(':').map(Number);
  const mesh=dots[group];
  mesh.getMatrixAt(index,instanceMatrix);
  instancePosition.setFromMatrixPosition(instanceMatrix);
  mesh.localToWorld(instancePosition);
  sitePulse.position.copy(instancePosition);
  sitePulse.material.color.setHex(hit.p.upcoming||hit.p._kind==='upcoming'?0x78aee9:hit.p.colocation?colocationColor:markerBlue);
  sitePulseStart=performance.now();
  sitePulse.visible=true;
}

let downX=0,downY=0,dragged=false,pinned=false,lastHover=null;
function clean(value){return value==null?'':String(value).trim();}
function first(p,keys){for(const k of keys){if(clean(p[k]))return clean(p[k]);}return '';}
function safeUrl(value){try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:'';}catch{return '';}}
function pick(e){
if(!dots.length)return null;
const rect=renderer.domElement.getBoundingClientRect();
pointer.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
ray.setFromCamera(pointer,camera);
const hits=ray.intersectObjects([sphere,...dots.filter(mesh=>mesh.visible&&mesh.count>0)],false);
const hit=hits[0]; // The globe occludes markers on its far side.
if(!hit||hit.object===sphere)return null;
const group=dots.indexOf(hit.object);
if(group<0)return null;
const p=records[group]?.[hit.instanceId];
if(activeContinent&&!siteGroups[group].historical&&siteGroups[group].items[hit.instanceId]?.continent!==activeContinent)return null;
return p?{p,id:group+':'+hit.instanceId}:null;
}
function placeTooltip(e){
const width=285,height=tooltip.offsetHeight||160;
tooltip.style.left=Math.max(14,Math.min(e.clientX+16,innerWidth-width-14))+'px';
tooltip.style.top=Math.max(14,Math.min(e.clientY+16,innerHeight-height-14))+'px';
}
function showSite(hit,e,lock){
showSitePulse(hit);
const p=hit.p;
tipName.textContent=label(p);
tipDetail.textContent=display(p);
tipStatus.textContent=p.upcoming?'● Upcoming · announced '+p.announced:p._kind==='historical'?(p.colocation?'● Operating colocation · documented by ':'● Operating · documented by ')+p.documented_by:p._kind==='existing'?'● Operating':p._kind==='upcoming'?'● Upcoming':'● Status unverified';
tipStatus.style.color=p.upcoming?'#527bad':p.colocation?'#b56524':p._kind==='historical'||p._kind==='existing'?'#2474dc':p._kind==='upcoming'?'#78aee9':'#8996a4';
const raw=statusList(p).map(clean).filter(Boolean).map(v=>v.replaceAll('_',' '));
const asOf=first(p,['newest_status_as_of','status_as_of','last_verified','observation_date']);
const operator=first(p,['operator','operator_name','company','owner','owner_name']);
const capacity=first(p,['reported_capacity_mw','capacity_mw']);
const precision=first(p,['location_precision','coordinate_precision','precision']);
const parts=[];
if(operator)parts.push('Operator: '+operator);
if(raw.length)parts.push('Reported status: '+raw.join(', '));
if(capacity)parts.push('Reported capacity: '+capacity+' MW');
if(p.approximate)parts.push('Approximate map location');
else if(precision)parts.push('Location precision: '+precision);
if(asOf)parts.push('Observed: '+asOf);
tipMore.textContent=parts.join(' · ');
renderConfirmedTenants(p.site_id);
const url=safeUrl(first(p,['source_url','evidence_url','website','url']));
tipSource.hidden=!url;if(url)tipSource.href=url;else tipSource.removeAttribute('href');
pinned=lock;tooltip.classList.toggle('pinned',lock);
tooltip.classList.add('visible');placeTooltip(e);
}
function hide(){pinned=false;lastHover=null;sitePulse.visible=false;tooltip.classList.remove('visible','pinned');}
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;dragged=false;controls.autoRotate=false;});
renderer.domElement.addEventListener('pointermove',e=>{
if(Math.hypot(e.clientX-downX,e.clientY-downY)>5)dragged=true;
if(pinned||e.buttons)return;
const hit=pick(e);
renderer.domElement.style.cursor=hit?'pointer':'grab';
if(!hit){lastHover=null;sitePulse.visible=false;tooltip.classList.remove('visible');return;}
if(hit.id!==lastHover){lastHover=hit.id;showSite(hit,e,false);}else placeTooltip(e);
});
renderer.domElement.addEventListener('pointerleave',()=>{if(!pinned)hide();});
renderer.domElement.addEventListener('click',e=>{
if(dragged)return;
const hit=pick(e);if(!hit){hide();return;}
lastHover=hit.id;showSite(hit,e,true);
});
document.getElementById('tipclose').addEventListener('click',hide);
const siteListDialog=document.getElementById('site-list-dialog');
const siteListItems=document.getElementById('site-list-items');
const siteListSummary=document.getElementById('site-list-summary');
const siteListEmpty=document.getElementById('site-list-empty');
const siteListToggle=document.getElementById('site-list-toggle');

function renderSiteList(){
  const historical=selectedYear!=='Now';
  const sites=historical
    ? [...historicalGroup.items.slice(0,historicalGroup.mesh.count),...historicalUpcomingGroup.items]
    : siteGroups.filter(group=>!group.historical).flatMap(group=>group.items)
      .filter(site=>!activeContinent||site.continent===activeContinent);
  sites.sort((a,b)=>label(a.p).localeCompare(label(b.p)));
  const scope=historical?'Selected sites in '+selectedYear:'Current Atlas · '+(activeContinent||'Worldwide');
  siteListSummary.textContent=scope+' · '+sites.length.toLocaleString()+' '+(sites.length===1?'site':'sites');
  siteListEmpty.hidden=sites.length>0;
  siteListEmpty.textContent=!historical&&liveSiteStatus?liveSiteStatus:'No sites in this view.';
  const rows=document.createDocumentFragment();
  for(const {p,kind} of sites){
    const row=document.createElement('li');
    row.className='site-list-row';
    const url=safeUrl(first(p,['source_url','evidence_url','website','url']));
    const name=document.createElement(url?'a':'span');
    name.textContent=label(p);
    if(url){
      name.href=url;
      name.target='_blank';
      name.rel='noopener noreferrer';
    }
    const status=document.createElement('span');
    status.className='site-list-status';
    if(p.upcoming||kind==='upcoming'){
      status.textContent='Upcoming';
      status.style.setProperty('--site-color','#b6d8fa');
    }else if(kind==='historical'||kind==='existing'){
      status.textContent=p.colocation?'Operating colocation':'Operating';
      status.style.setProperty('--site-color',p.colocation?'#b56524':'#2474dc');
    }else{
      status.textContent='Unverified';
    }
    const location=document.createElement('span');
    location.className='site-list-location';
    location.textContent=display(p);
    row.append(name,status,location);
    rows.appendChild(row);
  }
  siteListItems.replaceChildren(rows);
}

siteListToggle.addEventListener('click',()=>{
  hide();
  renderSiteList();
  siteListDialog.showModal();
});
siteListDialog.addEventListener('close',()=>siteListToggle.focus());
addEventListener('keydown',e=>{if(e.key==='Escape')hide();});
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.fov=w<690?48:36;camera.updateProjectionMatrix();const headerTop=document.querySelector('header').getBoundingClientRect().top;const footerTop=document.querySelector(w<=680?'footer':'.footnote').getBoundingClientRect().top;const available=Math.max(240,footerTop-headerTop-24);const desired=Math.max(160,Math.min(h*.72,available)-60);const fov=camera.fov*Math.PI/180;const distance=R/Math.sin(Math.atan(desired/h*Math.tan(fov/2)*2));camera.position.setLength(Math.max(5.95,distance));controls.minDistance=2.8;renderer.setSize(w,h);}
addEventListener('resize',resize);resize();
const timelineTicks=document.getElementById('history-ticks');
timelineTicks.addEventListener('milestonechange',({detail:{year}})=>{
  selectedYear=year;
  const historical=year!=='Now';
  historicalGroup.mesh.count=historical?historicalSites.filter(({p})=>p.documented_by<=year).length:0;
  setHistoricalUpcoming(year);
  for(const group of siteGroups)group.mesh.visible=group.historical===historical;
  hide();
  updateCount();
  if(!historical)loadSites();
});
timelineTicks.querySelector('[aria-pressed="true"]')?.click();
land();
let frame=0;
(function animate(time=performance.now()){
  requestAnimationFrame(animate);
  controls.update();
  globe.updateMatrixWorld();
  if(landPositions.length&&frame++%18===0)updateFocus();
  if(sitePulse.visible){
    sitePulse.quaternion.copy(camera.quaternion);
    animatePulse(sitePulse,time-sitePulseStart,1050);
  }
  renderer.render(scene,camera);
})();
</script>
</body>
